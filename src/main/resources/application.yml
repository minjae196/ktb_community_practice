spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


  profiles:
    active: dev

  session:
    store-type: redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

logging:
  level:
    org.hibernate.SQL: debug

file:
  dir: ./uploads/

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

cloud:
  aws:
    s3:
      bucket: community-image-545122900064-ap-northeast-2-an
    stack.auto: false
    region.static: ap-northeast-2

server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*" # 모든 액추에이터 엔드포인트 노출 (또는 health, metrics, prometheus만 지정 가능)
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: my-spring-app # 그라파나에서 앱 이름으로 필터링할 때 쓰입니다 (원하시는 이름으로 변경 가능)
    distribution:
      percentiles-histogram:
        http.server.requests: true # P95, P99 지연 시간(Histogram) 측정 활성화 (가장 중요!)
      percentiles:
        http.server.requests: 0.95, 0.99 # 백분위수 명시적 계산
