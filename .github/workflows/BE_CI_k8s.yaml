name: Backend CI (for K8s GitOps)

on:
  push:
    branches: [ "k8s" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Tests
        run: ./gradlew test

  # 2. 빌드 및 도커 허브 푸시
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Build without Tests (Fail-Fast)
        run: chmod +x ./gradlew && ./gradlew build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push BE Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kube-be:1.${{ github.run_number }}

  # 3. EC2 배포 대신 -> 인프라 레포지토리 업데이트 (GitOps)
  update-k8s-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: minjae196
          repositories: k8s-config-repo

      - name: Checkout K8s Config Repo
        uses: actions/checkout@v4
        with:
          repository: 'minjae196/k8s-config-repo'
          token: ${{ steps.generate-token.outputs.token }}
          ref: main

      - name: Update values.yaml with new image tag
        run: |
          yq -i '.be.image.tag = "1.${{ github.run_number }}"' chart/values.yaml
          git config user.name "GitHub Actions Bot"
          git add chart/values.yaml
          git commit -m "Update BE image tag to 1.${{ github.run_number }}"
          git push origin main

